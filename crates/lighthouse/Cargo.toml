[package]
name = "lighthouse"
description = "Game server status boards for Discord."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1"
axum.workspace = true
lighthouse-store.workspace = true
clap.workspace = true
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
getrandom = "0.2"
lighthouse-core.workspace = true
lighthouse-dashboard.workspace = true
lighthouse-discord.workspace = true
lighthouse-games.workspace = true
reqwest.workspace = true
self-replace = "1"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
