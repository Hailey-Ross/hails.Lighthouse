# Every push to main replaces the stable release, and adds a permanent vX.Y.Z release when the
# version in Cargo.toml is new.
name: Release

on:
  push:
    branches: [main]
    # Docs, images and tooling don't change the program: skip the build.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "assets/brand/**.png"
      - "assets/brand/**.gif"
      - "tools/**"
      - "LICENSE"
      - "NOTICE"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-stable
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The version must be valid and have its own CHANGELOG.md section. Minor stable builds keep the
      # number; raise it for notable changes.
      - name: Check version and changelog
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Cargo.toml version should look like 0.1.0, not '$v'"; exit 1; }
          grep -qx "## $v" CHANGELOG.md || { echo "CHANGELOG.md has no '## $v' section"; exit 1; }

  publish:
    needs: check
    uses: ./.github/workflows/publish.yml
    with:
      tag: stable
      prerelease: false
      banner: "**STABLE, rolling build.** The latest working build, from the `main` branch. Please report bugs. For the newest features, try [bleeding edge](https://github.com/Hailey-Ross/hails.Lighthouse/releases/tag/bleeding-edge)."
